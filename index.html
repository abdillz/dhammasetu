<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E2B3A">
  <meta name="description" content="Prototipe DHAMMASETU: kelas Pendidikan Agama Buddha gabungan lintas sekolah yang dikelola IABN Sriwijaya Tangerang.">
  <title>DHAMMASETU, prototipe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <aside class="side-note" aria-label="Tentang prototipe">
      <svg class="side-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo"/></svg>
      <h1>DHAMMASETU</h1>
      <p>Prototipe aplikasi kelas Pendidikan Agama Buddha gabungan lintas sekolah, dikelola IABN Sriwijaya Tangerang.</p>
      <p>Coba keempat peran dari layar masuk. Semua nama, sekolah, vihara, dan angka adalah data contoh untuk keperluan demonstrasi.</p>
      <button class="link-btn" data-action="reset">Atur ulang data demo</button>
    </aside>
    <main id="app" class="phone" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="logo" viewBox="0 0 64 64">
        <path d="M6 44 Q32 12 58 44" fill="none" stroke="#E39B2D" stroke-width="4" stroke-linecap="round"/>
        <line x1="6" y1="44" x2="58" y2="44" stroke="#E39B2D" stroke-width="4" stroke-linecap="round"/>
        <circle cx="32" cy="30" r="9" fill="none" stroke="currentColor" stroke-width="3"/>
        <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="32" y1="21" x2="32" y2="39"/><line x1="23" y1="30" x2="41" y2="30"/>
          <line x1="25.6" y1="23.6" x2="38.4" y2="36.4"/><line x1="38.4" y1="23.6" x2="25.6" y2="36.4"/>
        </g>
        <line x1="20" y1="44" x2="20" y2="52" stroke="#E39B2D" stroke-width="3"/>
        <line x1="44" y1="44" x2="44" y2="52" stroke="#E39B2D" stroke-width="3"/>
      </symbol>
    </defs>
  </svg>
  <script src="app.js"></script>
</body>
</html>
